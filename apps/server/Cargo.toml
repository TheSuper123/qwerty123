[package]
name = "most-server"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "MostServer — personal iPhone application installer"
license = "MIT"
publish = false

[[bin]]
name = "MostServer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["multipart"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "installation_proxy", "afc", "pair"] }
isideload = { version = "=0.5.0", default-features = false, features = ["install", "tokio-mt"] }
open = "5.3.3"
plist = "1.8.0"
rand = "0.8.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ring = "0.17.14"
rootcause = "0.12.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zeroize = "1.9.0"
subtle = "2.6.1"
zip = { version = "8.3.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
http-body-util = "0.1.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
