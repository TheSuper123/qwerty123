name: MostStore
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: org.moststore.app
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: MostStore
    INFOPLIST_KEY_NSCameraUsageDescription: Zeskanuj kod QR wyświetlony przez MostServer na Twoim komputerze.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Połącz z własnym MostServer w tej samej sieci i zleć instalację aplikacji.
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MostStore:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
schemes:
  MostStore:
    build:
      targets:
        MostStore: all
    archive:
      config: Release
