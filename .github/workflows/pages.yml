name: Publish Most to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Pages activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          settings_url="https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"; then
            echo "::error title=Pages configuration unavailable::Open ${settings_url} and select Build and deployment > Source > GitHub Actions. Pages must be activated before this workflow can publish. If Pages is already enabled, check repository permissions and Pages availability."
            printf '%s\n' \
              '## GitHub Pages wymaga konfiguracji' \
              "1. Otwórz ${settings_url}." \
              '2. W Build and deployment wybierz Source: GitHub Actions.' \
              '3. Po zapisaniu wróć do Actions i uruchom Publish Most to GitHub Pages przez Run workflow na main.' \
              'Jeśli Pages jest już aktywne, sprawdź uprawnienia repozytorium i dostępność Pages dla jego planu.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error title=Wrong Pages source::Open ${settings_url} and set Source to GitHub Actions, then run this workflow again."
            printf '%s\n' \
              '## Zmień źródło publikacji Pages' \
              "Otwórz ${settings_url} i w Build and deployment ustaw Source: GitHub Actions." \
              'Następnie uruchom Publish Most to GitHub Pages przez Run workflow na main.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
